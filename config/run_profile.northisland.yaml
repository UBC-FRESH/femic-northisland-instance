selection:
  # The custom AOI is keyed as northisland so the artifact names and the
  # bundle rows match the boundary code.
  tsa:
    - "northisland"

  # Basecamp email thread, 2026-10-21: the AOI is the part of the North Island
  # TSA inside the North Island - Central Coast Natural Resource District, with
  # the community forest agreement added back. build_aoi.py materializes this
  # boundary from public BC layers.
  boundary_path: "data/source/aoi/northisland_aoi.gpkg"
  boundary_layer: "northisland_aoi"
  boundary_code: "northisland"
  strata: []

modes:
  resume: false
  dry_run: false
  verbose: true
  skip_checks: false

  # First executable lane. Auto sampling keeps each VDYP console batch inside
  # the current 30-second timeout; switch back to all after the timeout is
  # raised. The managed lane is a VDYP transform, not accepted TIPSY output.
  vdyp_sampling_mode: auto
  vdyp_two_pass_rebin: false
  vdyp_min_stands_per_si_bin: 10
  managed_curve_mode: vdyp_transform

run:
  run_id: "northisland_20261021"
  log_dir: "runtime/logs"
