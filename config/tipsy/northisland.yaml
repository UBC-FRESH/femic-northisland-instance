schema_version: 1
tsa_code: northisland
metadata:
  source_tsr:
  - title: North Island TSA Timber Supply Review Data Package
    year: 2020
    url: https://www2.gov.bc.ca/assets/gov/farming-natural-resources-and-industry/forestry/stewardship/forest-analysis-inventory/tsr-annual-allowable-cut/48tsdp_2020.pdf
    notes: TIPSY model, site index, genetic gain, OAF, and AU definition sections;
      Table 4 netdown.
  - title: North Island TSA Discussion Paper
    year: 2022
    url: https://www2.gov.bc.ca/assets/gov/farming-natural-resources-and-industry/forestry/stewardship/forest-analysis-inventory/tsr-annual-allowable-cut/48ts_pdp_2022.pdf
    notes: Table 5 updated netdown; TIPSY species ingress discussion.
  - title: AAC Rationale for North Island TSA
    year: 2024
    url: https://www2.gov.bc.ca/assets/gov/farming-natural-resources-and-industry/forestry/stewardship/forest-analysis-inventory/tsr-annual-allowable-cut/48ts_ra_2024.pdf
    notes: AAC, THLB, and managed-stand interpretation.
  author: UBC FRESH Lab
  created_utc: '2026-10-22T00:00:00+00:00'
  notes: AU rules mapped from the TSR data package and the model AU table. The TSR
    reference tsa48_tipsy_input table is not published; species/density/SI are model-derived,
    while OAF2, genetic worth, and regeneration rules are TSR-sourced. OAF1 is computed
    by FEMIC from the VDYP run.
